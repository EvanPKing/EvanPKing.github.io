<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Academic homepage of Shenghao Wang" />
    <meta name="author" content="Shenghao Wang" />
    <title id="title"></title>

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
        (function () {
            var theme = 'dark';
            try {
                var fromUrl = new URLSearchParams(window.location.search).get('theme');
                var stored = localStorage.getItem('homepage-theme');
                if (fromUrl === 'light' || fromUrl === 'dark') theme = fromUrl;
                else if (stored === 'light') theme = 'light';
            } catch (e) { }
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico?v=20261112" />

    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Site styles -->
    <link type="text/css" href="static/css/styles.css?v=20261112" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css?v=20261112" rel="stylesheet" />
</head>

<body>
    <header class="site-header">
        <div class="nav-inner">
            <a class="nav-brand" href="#home">Shenghao Wang</a>
            <nav class="nav-links" id="site-nav">
                <a class="nav-link" href="#home" data-i18n="nav.home">Homepage</a>
                <a class="nav-link" href="#awards" data-i18n="nav.awards">Honors</a>
                <a class="nav-link" href="#experience" data-i18n="nav.experience">Experience</a>
                <a class="nav-link" href="#projects" data-i18n="nav.projects">Projects</a>
                <a class="nav-link" href="#publications" data-i18n="nav.publications">Publications</a>
            </nav>
            <div class="nav-actions">
                <button id="lang-toggle" class="icon-btn lang-btn" type="button"
                    aria-label="切换到中文">中文</button>
                <button id="theme-toggle" class="icon-btn" type="button"
                    aria-label="Toggle theme"><i class="bi bi-sun-fill"></i></button>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <img class="avatar" src="static/assets/img/photo.jpg?v=20261112"
                alt="Portrait of Shenghao Wang" />
            <h1 class="sidebar-name" id="sidebar-name"></h1>
            <p class="sidebar-role" id="sidebar-role"></p>
            <ul class="profile-meta">
                <li><i class="bi bi-geo-alt-fill"></i><span id="sidebar-location"></span></li>
                <li><i class="bi bi-building"></i><span id="sidebar-affiliation"></span></li>
                <li><i class="bi bi-envelope-fill"></i><a id="email-href" href="mailto:"><span
                            id="sidebar-email"></span></a></li>
                <li><i class="bi bi-google"></i><a id="scholar-href" href="#">Google Scholar</a></li>
                <li><i class="bi bi-github"></i><a id="github-href" href="#">GitHub</a></li>
                <li><i class="bi bi-linkedin"></i><a id="linkedin-href" href="#">LinkedIn</a></li>
            </ul>
        </aside>

        <main class="content">
            <section id="home">
                <h2 class="page-title" id="content-name"></h2>
                <div id="home-md" class="md"></div>
            </section>

            <section id="awards">
                <h2 class="section-title"><i class="bi bi-trophy-fill"></i><span
                        data-i18n="section.awards">Honors</span></h2>
                <div id="awards-md" class="md"></div>
            </section>

            <section id="experience">
                <h2 class="section-title"><i class="bi bi-briefcase-fill"></i><span
                        data-i18n="section.experience">Experience</span></h2>
                <div id="experience-md" class="md"></div>
            </section>

            <section id="projects">
                <h2 class="section-title"><i class="bi bi-folder-fill"></i><span
                        data-i18n="section.projects">Projects</span></h2>
                <div id="projects-md" class="md"></div>
            </section>

            <section id="publications">
                <h2 class="section-title"><i class="bi bi-file-text-fill"></i><span
                        data-i18n="section.publications">Publications</span></h2>
                <div id="publications-md" class="md"></div>
            </section>

            <footer class="site-footer">
                <span id="copyright-text"></span>
                <span class="sep">&middot;</span>
                <a href="https://github.com/EvanPKing">GitHub</a>
                <span class="sep">&middot;</span>
                <a href="https://github.com/EvanPKing/EvanPKing.github.io/blob/main/LICENSE">License</a>
            </footer>
        </main>
    </div>

    <!-- Bootstrap core JS -->
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js?v=20261112"></script>

    <!-- Markdown -->
    <script type="text/javascript" src="static/js/marked.min.js?v=20261112"></script>
    <script type="text/javascript" src="static/js/js-yaml.min.js?v=20261112"></script>

    <!-- Mathematics -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                processEnvironments: true
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- Site scripts -->
    <script type="text/javascript" src="static/js/scripts.js?v=20261112"></script>
</body>

</html>
